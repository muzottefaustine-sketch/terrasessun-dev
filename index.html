<!DOCTYPE html><html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soleilenterrasse">
  <meta name="format-detection" content="telephone=no">
  <title>Soleilenterrasse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --yellow: #FFD600; --yellow-bg: #FFFBE0;
      --shade: #8E9BAD; --shade-bg: #EEF1F5;
      --text: #1C1C1E; --text-2: #6C6C70; --text-3: #AEAEB2;
      --divider: rgba(0,0,0,0.06); --panel-w: 320px;
      --radius-md: 16px; --radius-sm: 12px;
      --glass: rgba(255,255,255,0.88);
      --glass-border: rgba(255,255,255,0.72);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
      --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.9);
      --white: #FFFFFF; --bg: #F2F2F7;
    }
    .panel-map input[type=range] { touch-action: pan-x; }
    #cesiumContainer { touch-action: none; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: var(--font); background: #000; position: fixed; inset: 0; -webkit-font-smoothing: antialiased; }

    #splash { position: fixed; inset: 0; z-index: 1000; background: linear-gradient(155deg, #FFFEF5 0%, #FFF8D6 55%, #FFFFFF 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    .splash-sun { width: 96px; height: 96px; margin-bottom: 28px; animation: splash-pulse 2.5s ease-in-out infinite; filter: drop-shadow(0 6px 22px rgba(255,214,0,0.45)); }
    @keyframes splash-pulse { 0%,100%{transform:scale(1) rotate(0deg);filter:drop-shadow(0 6px 22px rgba(255,214,0,0.45));} 50%{transform:scale(1.08) rotate(6deg);filter:drop-shadow(0 10px 30px rgba(255,214,0,0.65));} }
    .splash-name { font-family: var(--font); font-size: 34px; font-weight: 800; color: var(--text); letter-spacing: -1.2px; margin-bottom: 8px; }
    .splash-name em { font-style: italic; font-weight: 800; }
    .splash-name span { font-style: normal; font-weight: 800; color: var(--yellow); }
    .splash-tagline { font-family: var(--font); font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.6; max-width: 220px; font-weight: 400; }
    .splash-tagline strong { color: #9A7500; font-weight: 600; }
    .splash-progress-wrap { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); width: 140px; }
    .splash-progress-track { width: 100%; height: 3px; background: #E5E5EA; border-radius: 3px; overflow: hidden; }
    .splash-progress-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #FFD600, #FFC000); width: 0%; transition: width 0.25s ease; }
    .splash-status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-family: var(--font); font-size: 11px; font-weight: 500; color: var(--text-3); white-space: nowrap; }

    #cesiumContainer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    .cesium-widget canvas { outline: none !important; }
    .cesium-selection-wrapper, .cesium-infoBox { display: none !important; }
    .cesium-widget-credits { display: none !important; }

    #topBar {
      position: fixed; top: calc(env(safe-area-inset-top, 44px) + 12px); left: 50%;
      transform: translate3d(-50%, 0, 0); -webkit-transform: translate3d(-50%, 0, 0);
      will-change: transform; isolation: isolate; z-index: 30;
      width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; gap: 10px;
    }
    .search-glass {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-radius: 18px; padding: 0 16px; height: 52px;
      box-shadow: var(--shadow-md), var(--shadow-inset);
      border: 1px solid var(--glass-border);
    }
    .search-glass svg { flex-shrink: 0; opacity: 0.28; }
    #searchInput { flex: 1; border: none; background: transparent; font-family: var(--font); font-size: 15px; font-weight: 500; color: var(--text); outline: none; }
    #searchInput::placeholder { color: var(--text-3); font-weight: 400; }
    .search-clear-btn { background: rgba(0,0,0,0.07); border: none; cursor: pointer; color: var(--text-2); font-size: 11px; padding: 0; display: none; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-weight: 700; }
    .search-clear-btn.visible { display: flex; }
    .icon-btn {
      flex-shrink: 0; width: 52px; height: 52px; background: var(--glass);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border); border-radius: 18px;
      box-shadow: var(--shadow-md), var(--shadow-inset);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.15s;
      -webkit-transform: translate3d(0, 0, 0); will-change: transform; isolation: isolate;
    }
    .icon-btn:active { transform: scale(0.91); background: rgba(255,255,255,0.98); }
    #btnGeo.locating { animation: geo-pulse 1s ease-in-out infinite; }
    @keyframes geo-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    #btnVille {
      flex-shrink: 0; height: 52px; padding: 0 16px;
      background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border); border-radius: 18px;
      box-shadow: var(--shadow-md), var(--shadow-inset);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.15s;
      -webkit-transform: translate3d(0, 0, 0); will-change: transform; isolation: isolate;
    }
    #btnVille:active { transform: scale(0.91); background: rgba(255,255,255,0.98); }

    #cityMenu {
      position: fixed;
      top: calc(env(safe-area-inset-top, 44px) + 72px);
      right: 16px;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.07);
      z-index: 100; display: none; min-width: 170px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.8); transform-origin: top right;
    }
    #cityMenu.open { display: block; animation: menu-pop 0.22s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes menu-pop { from { opacity: 0; transform: scale(0.88) translateY(-6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .city-item {
      padding: 13px 18px; font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--text);
      cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.04);
      transition: background 0.1s; display: flex; align-items: center; justify-content: space-between;
    }
    .city-item:last-child { border-bottom: none; }
    .city-item.active { color: #9A7500; background: linear-gradient(135deg, #FFF9D0, #FFFBE6); }
    .city-item.active::after { content: '✓'; font-size: 12px; color: #9A7500; font-weight: 800; }
    .city-item:active { background: var(--bg); }

    .panel-map {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 34px) + 16px); left: 50%;
      transform: translateX(-50%); background: var(--glass);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border); padding: 18px 24px 16px; border-radius: 28px;
      box-shadow: var(--shadow-md), var(--shadow-inset);
      text-align: center; z-index: 30; width: 84%; max-width: 420px;
    }
    .panel-map h3 { margin: 0 0 14px 0; font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.3px; text-transform: uppercase; }
    .panel-map h3 .heure { font-family: var(--font); font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.8px; text-transform: none; }
    .panel-map input[type=range] { width: 100%; cursor: pointer; -webkit-appearance: none; height: 5px; border-radius: 3px; background: linear-gradient(to right, var(--yellow) var(--pct,46%), rgba(0,0,0,0.08) var(--pct,46%)); outline: none; }
    .panel-map input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: white; border: 3px solid var(--yellow); box-shadow: 0 2px 12px rgba(255,214,0,0.4), 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; }
    .panel-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-3); font-weight: 600; }

    #tooltip { position: fixed; z-index: 50; background: rgba(18,18,20,0.95); color: white; padding: 14px 20px; border-radius: 20px; font-size: 15px; font-weight: 600; pointer-events: none; opacity: 0; transform: translateY(8px) scale(0.97); transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1); backdrop-filter: blur(20px); max-width: 260px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 16px 48px rgba(0,0,0,0.3); }
    #tooltip.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    #tooltip .tt-type { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 3px; font-weight: 500; }
    #tooltip .tt-sun { font-size: 13px; font-weight: 600; margin-top: 8px; padding: 5px 12px; border-radius: 10px; display: inline-block; }
    #tooltip .tt-sun.sun { color: #FFD600; background: rgba(255,214,0,0.12); }
    #tooltip .tt-sun.shade { color: #90CAF9; background: rgba(144,202,249,0.12); }

    #drawer { position: fixed; z-index: 40; background: var(--white); display: flex; flex-direction: column; transition: transform 0.38s cubic-bezier(0.32,0.72,0,1); }
    @media (min-width: 641px) { #drawer { top:0; right:0; width:var(--panel-w); height:100vh; border-left:1px solid var(--divider); transform:translateX(110%); } #drawer.open { transform:translateX(0); } }
    @media (max-width: 640px) { #drawer { left:0; bottom:0; width:100%; height:80vh; border-radius:24px 24px 0 0; border-top:1px solid var(--divider); box-shadow:0 -12px 48px rgba(0,0,0,0.14); transform:translateY(110%); } #drawer.open { transform:translateY(0); } }
    .drawer-handle { display:none; justify-content:center; padding:14px 0 4px; flex-shrink:0; cursor:pointer; }
    .drawer-bar { width:36px; height:4px; background:rgba(0,0,0,0.1); border-radius:4px; }
    @media (max-width:640px) { .drawer-handle { display:flex; } }
    .drawer-header { padding:20px 20px 0; flex-shrink:0; }
    .drawer-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .drawer-title { font-family: var(--font); font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.6px; }
    .drawer-title em { font-style: italic; font-weight: 800; }
    .drawer-title span { font-style: normal; color: var(--yellow); font-weight: 800; }
    #btnClose { background: rgba(0,0,0,0.06); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: background 0.15s; }
    #btnClose:active { background: rgba(0,0,0,0.12); }
    .drawer-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 14px; padding: 0 14px; height: 42px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.04); }
    .drawer-search svg { flex-shrink: 0; opacity: 0.28; }
    #drawerSearch { flex: 1; border: none; background: transparent; font-family: var(--font); font-size: 15px; font-weight: 500; color: var(--text); outline: none; }
    #drawerSearch::placeholder { color: var(--text-3); font-weight: 400; }
    .section-title { padding:4px 20px 10px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .section-label { font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; }
    .count-pill { font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; background: linear-gradient(135deg, #FFD600, #FFC000); color:#7A6000; box-shadow: 0 2px 8px rgba(255,192,0,0.28); }
    #loadingState { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-3); font-size:13px; font-weight:500; }
    .spinner { width:24px; height:24px; border:2.5px solid var(--divider); border-top-color:var(--yellow); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .list { flex:1; overflow-y:auto; padding:0 12px 32px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .list::-webkit-scrollbar { display:none; }
    .card { display:flex; align-items:center; gap:12px; padding:11px 10px; border-radius:16px; cursor:pointer; transition: background 0.12s, transform 0.1s; margin-bottom:2px; }
    .card:active, .card.active { background:rgba(0,0,0,0.04); transform:scale(0.99); }
    .card-icon { width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .card-icon.sun { background: linear-gradient(135deg, #FFF3A0 0%, #FFFBE0 100%); box-shadow: 0 2px 8px rgba(255,214,0,0.2); }
    .card-icon.shade { background: var(--shade-bg); }
    .card-body { flex:1; min-width:0; }
    .card-name { font-family: var(--font); font-size:15px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
    .card-sub { font-family: var(--font); font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:400; }
    .card-badge { flex-shrink:0; font-family: var(--font); font-size:10px; font-weight:700; padding:4px 9px; border-radius:9px; white-space:nowrap; }
    .card-badge.sun { background: linear-gradient(135deg, #FFF3A0, #FFE050); color:#7A6000; }
    .card-badge.shade { background:var(--shade-bg); color:var(--shade); }
    .no-results { padding:40px 20px; text-align:center; color:var(--text-3); font-family: var(--font); font-size:13px; line-height:1.7; }
    .drawer-footer { padding:12px 20px; border-top:1px solid var(--divider); display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .footer-text { font-family: var(--font); font-size:10px; color:var(--text-3); font-weight:500; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#34C759; animation:blink 2s ease-in-out infinite; flex-shrink:0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .privacy-link { margin-left:auto; font-family: var(--font); font-size:10px; color:var(--text-3); cursor:pointer; text-decoration:none; font-weight:500; }
  </style>
</head>
<body>

<div id="splash">
  <div class="splash-sun">
    <svg viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
      <g fill="#FFD600">
        <ellipse cx="50" cy="11" rx="3.2" ry="7" transform="rotate(0 50 50)"/>
        <ellipse cx="50" cy="11" rx="2.8" ry="6.5" transform="rotate(40 50 50)"/>
        <ellipse cx="50" cy="11" rx="3.4" ry="7.5" transform="rotate(75 50 50)"/>
        <ellipse cx="50" cy="11" rx="3" ry="6.8" transform="rotate(110 50 50)"/>
        <ellipse cx="50" cy="11" rx="2.8" ry="6.2" transform="rotate(145 50 50)"/>
        <ellipse cx="50" cy="11" rx="3.3" ry="7.2" transform="rotate(180 50 50)"/>
        <ellipse cx="50" cy="11" rx="2.9" ry="6.5" transform="rotate(215 50 50)"/>
        <ellipse cx="50" cy="11" rx="3.5" ry="7" transform="rotate(250 50 50)"/>
        <ellipse cx="50" cy="11" rx="2.8" ry="6.3" transform="rotate(285 50 50)"/>
        <ellipse cx="50" cy="11" rx="3.1" ry="7.2" transform="rotate(320 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="21" fill="#FFD600"/>
      <circle cx="48" cy="48" r="17" fill="#FFE000" opacity="0.55"/>
      <circle cx="52" cy="52" r="14" fill="#FFC400" opacity="0.25"/>
    </svg>
  </div>
  <div class="splash-name"><em>Soleil</em><span>enterrasse</span></div>
  <div class="splash-tagline">Trouvez vos <strong>terrasses au soleil</strong><br>maintenant.</div>
  <div class="splash-progress-wrap">
    <div class="splash-progress-track"><div class="splash-progress-bar" id="progressBar"></div></div>
  </div>
  <div class="splash-status" id="splashStatus">Chargement…</div>
</div>

<div id="cesiumContainer"></div>

<div id="topBar">
  <div class="search-glass">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#1C1C1E" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="#1C1C1E" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Cherche ta terrasse au soleil…">
    <button class="search-clear-btn" id="searchClear">✕</button>
  </div>
  <button class="icon-btn" id="btnListe" onclick="openDrawer()" title="Liste">
    <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect width="18" height="2" rx="1" fill="#1C1C1E"/><rect y="6" width="18" height="2" rx="1" fill="#1C1C1E"/><rect y="12" width="18" height="2" rx="1" fill="#1C1C1E"/></svg>
  </button>
  <button id="btnVille" ontouchend="toggleCityMenu()">
    <span id="villeLabel">Bordeaux</span> ▾
  </button>
  <button class="icon-btn" id="btnGeo" onclick="geolocate()" title="Ma position">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.5" fill="#007AFF"/><circle cx="10" cy="10" r="6" stroke="#007AFF" stroke-width="1.2" fill="none" opacity="0.35"/></svg>
  </button>
</div>

<div id="cityMenu"></div>

<div class="panel-map">
  <h3>☀️ <span class="heure" id="heureAffichee">14h00</span></h3>
  <input type="range" id="timeSlider" min="8" max="21" value="14" step="0.25">
  <div class="panel-labels"><span>8h</span><span>20h</span></div>
</div>

<div id="tooltip">
  <div id="ttName"></div>
  <div class="tt-type" id="ttType"></div>
  <div class="tt-sun" id="ttSun"></div>
  <a id="ttMaps" href="#" target="_blank" style="display:block;margin-top:8px;background:rgba(255,255,255,0.15);color:white;padding:6px 14px;border-radius:10px;font-size:12px;text-align:center;text-decoration:none;">Ouvrir dans Maps</a>
</div>

<div id="drawer">
  <div class="drawer-handle" id="drawerHandle"><div class="drawer-bar"></div></div>
  <div class="drawer-header">
    <div class="drawer-top">
      <div class="drawer-title"><em>Soleil</em><span>enterrasse</span></div>
      <button id="btnClose" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#1C1C1E" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="#1C1C1E" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="drawerSearch" placeholder="Rechercher un établissement…">
    </div>
  </div>
  <div class="section-title"><span class="section-label">Résultats</span></div>
  <div id="loadingState"><div class="spinner"></div><span>Chargement…</span></div>
  <div class="list" id="terrasseList" style="display:none;"></div>
  <div class="drawer-footer">
    <div class="live-dot"></div>
    <span class="footer-text" id="footerText">Ombres 3D · OpenStreetMap</span>
    <a class="privacy-link" href="https://soleil-bordeaux.vercel.app/privacy.html" target="_blank">Confidentialité</a>
  </div>
</div>

<script>
(function() {
  const _orig = navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);
  let _pos = null;
  navigator.geolocation.getCurrentPosition = function(ok, err, opt) {
    if (_pos) { ok(_pos); return; }
    _orig(p => { _pos = p; ok(p); }, err, { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 });
  };
})();

const CITIES = [
  {id:'bordeaux',   nom:'Bordeaux',    lat:44.837789, lng:-0.57918 },
  {id:'marseille',  nom:'Marseille',   lat:43.296482, lng:5.381118 },
  {id:'lyon',       nom:'Lyon',        lat:45.764043, lng:4.835659 },

let userDot = null;
function makeUserDot() {
  const c = document.createElement('canvas'); c.width = 20; c.height = 20; const ctx = c.getContext('2d');
  ctx.beginPath(); ctx.arc(10,10,9,0,Math.PI*2); ctx.fillStyle='rgba(0,122,255,0.18)'; ctx.fill();
  ctx.beginPath(); ctx.arc(10,10,6,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.beginPath(); ctx.arc(10,10,4,0,Math.PI*2); ctx.fillStyle='#007AFF'; ctx.fill();
  return c.toDataURL();
}
function placeUserDot(lng, lat) {
  if (userDot) viewer.entities.remove(userDot);
  userDot = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(lng, lat, 3), billboard: { image:makeUserDot(), verticalOrigin:Cesium.VerticalOrigin.CENTER, heightReference:Cesium.HeightReference.RELATIVE_TO_GROUND, width:20, height:20, disableDepthTestDistance:Number.POSITIVE_INFINITY } });
}
const _origGPS = navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);
let _cachedPos = null;
navigator.geolocation.getCurrentPosition = function(ok, err, opt) { if (_cachedPos) { ok(_cachedPos); return; } _origGPS(p => { _cachedPos = p; ok(p); }, err, opt); };
function geolocate() {
  if (!navigator.geolocation) return;
  const btn = document.getElementById('btnGeo'); btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('locating');
    const { longitude:lng, latitude:lat } = pos.coords;
    placeUserDot(lng, lat);
    viewer.camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(lng,lat,400), orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0}, duration:1.8 });
  }, ()=>btn.classList.remove('locating'), { enableHighAccuracy:true, timeout:8000 });
}

let terrasses=[], sunStates={}, searchQuery='', currentHeure=14, currentDate=new Date();
const markerEntities={};

function typeLabel(a){return{bar:'Bar',cafe:'Café',restaurant:'Restaurant',pub:'Pub',biergarten:'Brasserie'}[a]||'Terrasse';}

const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function fetchTerrasses(){
  try {
    const res = await fetch(`/data/${currentCity.id}.json`);
    if(!res.ok) throw new Error();
    const data = await res.json();
    const seen = new Set();
    return (data.features || data.elements || [])
      .filter(f => f.properties?.name && !seen.has(f.properties.name) && seen.add(f.properties.name))
      .map(f => ({
        id: f.properties['@id'] || f.properties.id || Math.random(),
        nom: f.properties.name,
        adresse: f.properties['addr:street'] ? ((f.properties['addr:housenumber']||'')+' '+f.properties['addr:street']).trim() : '',
        type: typeLabel(f.properties.amenity),
        lng: f.geometry.coordinates[0],
        lat: f.geometry.coordinates[1]
      }));
  } catch(e) {
    console.warn('JSON local non trouvé, fallback Overpass');
    const bbox=`${currentCity.lat-0.04},${currentCity.lng-0.06},${currentCity.lat+0.04},${currentCity.lng+0.06}`;
    const q=`[out:json][timeout:25];(node["amenity"~"bar|cafe|restaurant|pub|biergarten"](${bbox}););out body;`;
    for(const url of OVERPASS){try{const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)throw new Error();const d=await r.json();const seen=new Set();return(d.elements||[]).filter(el=>el.lat&&el.lon&&el.tags?.name&&!seen.has(el.tags.name)&&seen.add(el.tags.name)).slice(0,150).map(el=>({id:el.id,nom:el.tags.name,adresse:el.tags['addr:street']?((el.tags['addr:housenumber']||'')+' '+el.tags['addr:street']).trim():'',type:typeLabel(el.tags.amenity),lng:el.lon,lat:el.lat}));}catch(e){}}
    return [];
  }
}

function getSunDir(jd){
  const s=Cesium.Simon1994PlanetaryPositions.computeSunPositionInEarthInertialFrame(jd);
  const m=Cesium.Transforms.computeIcrfToFixedMatrix(jd); if(!m) return null;
  const d=new Cesium.Cartesian3(); Cesium.Matrix3.multiplyByVector(m,s,d); return Cesium.Cartesian3.normalize(d,d);
}
function checkSunny(t,sunDir){
  if(!sunDir) return false;
  const pos=Cesium.Cartesian3.fromDegrees(t.lng,t.lat,4); const up=Cesium.Cartesian3.normalize(pos,new Cesium.Cartesian3());
  if(Cesium.Cartesian3.dot(sunDir,up)<=0.0) return false;
  return !viewer.scene.pickFromRay(new Cesium.Ray(pos,sunDir),Object.values(markerEntities));
}

let cameraMoving=false;
viewer.camera.moveStart.addEventListener(()=>{cameraMoving=true;});
viewer.camera.moveEnd.addEventListener(()=>{cameraMoving=false;});

let shadowDebounce=null,computing=false,shadowVersion=0;
function scheduleShadow(){
  clearTimeout(shadowDebounce);
  shadowDebounce=setTimeout(()=>{
    if(cameraMoving) return;
    const unsub=viewer.scene.postRender.addEventListener(()=>{ unsub(); runShadow(); });
  }, 500);
}
async function runShadow(){
  if(computing) return; computing=true; const version=++shadowVersion;
  const jd=viewer.clock.currentTime; const sunDir=getSunDir(jd);
  for(let i=0;i<terrasses.length;i+=10){
    if(version!==shadowVersion||cameraMoving){computing=false;return;}
    for(const t of terrasses.slice(i,i+10)) sunStates[t.id]=checkSunny(t,sunDir);
    syncDots();
    renderList(currentHeure,searchQuery);
    await new Promise(r=>setTimeout(r,0));
  }
  computing=false;
}

const DOT_SUN = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"><line x1="16" y1="1" x2="16" y2="7"/><line x1="16" y1="25" x2="16" y2="31"/><line x1="1" y1="16" x2="7" y2="16"/><line x1="25" y1="16" x2="31" y2="16"/><line x1="5" y1="5" x2="9.2" y2="9.2"/><line x1="22.8" y1="22.8" x2="27" y2="27"/><line x1="27" y1="5" x2="22.8" y2="9.2"/><line x1="9.2" y1="22.8" x2="5" y2="27"/></g><circle cx="16" cy="16" r="7" fill="#FFD600" stroke="white" stroke-width="2.5"/></svg>');
const DOT_SHADE = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="rgba(142,155,173,0.85)" stroke="white" stroke-width="2"/></svg>');

function syncDots(){
  terrasses.forEach(t=>{
    const s=sunStates[t.id]===true;
    const img=s?DOT_SUN:DOT_SHADE;
    if(!markerEntities[t.id]){
      markerEntities[t.id]=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(t.lng,t.lat,2),billboard:{image:img,verticalOrigin:Cesium.VerticalOrigin.CENTER,heightReference:Cesium.HeightReference.RELATIVE_TO_GROUND,width:32,height:32,disableDepthTestDistance:Number.POSITIVE_INFINITY},properties:{id:t.id}});
    }else{ markerEntities[t.id].billboard.image=img; markerEntities[t.id].show=true; }
  });
}

const tooltip=document.getElementById('tooltip'); let ttTimeout=null;
function showTooltip(t,x,y){
  document.getElementById('ttName').textContent=t.nom;
  document.getElementById('ttType').textContent=t.type+(t.adresse?' · '+t.adresse:'');
  const w=260; tooltip.style.left=Math.min(Math.max(x-w/2,10),window.innerWidth-w-10)+'px'; tooltip.style.top=Math.max(y-130,10)+'px';
  tooltip.classList.add('visible'); if(navigator.vibrate) navigator.vibrate(10);
  const ml=document.getElementById('ttMaps'); if(ml) ml.href=`https://maps.apple.com/?q=${encodeURIComponent(t.nom+', '+currentCity.nom)}&ll=${t.lat},${t.lng}`;
  clearTimeout(ttTimeout); ttTimeout=setTimeout(()=>tooltip.classList.remove('visible'),6000);
}
function hideTooltip(){clearTimeout(ttTimeout);tooltip.classList.remove('visible');}

function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function highlight(text,q){if(!q)return text;return text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark style="background:#FFFBE0;color:#9A7E00;border-radius:3px;padding:0 2px">$1</mark>');}

function renderList(h,query){
  const list=document.getElementById('terrasseList');
  const q=normalize(query||'');
  let filtered=terrasses; if(q) filtered=terrasses.filter(t=>normalize(t.nom).includes(q)||normalize(t.type).includes(q)||normalize(t.adresse).includes(q));
  const sorted=[...filtered].sort((a,b)=>(sunStates[b.id]?1:0)-(sunStates[a.id]?1:0));
  list.innerHTML='';
  if(!sorted.length){list.innerHTML=`<div class="no-results">Aucun résultat${query?' pour <strong>"'+query+'"</strong>':''}</div>`;return;}
  sorted.forEach(t=>{
    const card=document.createElement('div'); card.className='card'; card.dataset.id=t.id;
    const sunny=sunStates[t.id]===true;
    card.innerHTML=`<div class="card-icon ${sunny?'sun':'shade'}">${sunny?'☀️':'🌥️'}</div><div class="card-body"><div class="card-name">${highlight(t.nom,query)}</div><div class="card-sub">${t.type}${t.adresse?' · '+t.adresse:''}</div></div><div class="card-badge ${sunny?'sun':'shade'}">${sunny?'Soleil':'Ombré'}</div>`;
    card.addEventListener('click',()=>{ document.querySelectorAll('.card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); closeDrawer(); viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(t.lng,t.lat,300),orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0},duration:0});});
    list.appendChild(card);
  });
}

const searchInput=document.getElementById('searchInput'),searchClear=document.getElementById('searchClear');
searchInput.addEventListener('input',e=>{searchQuery=e.target.value;document.getElementById('drawerSearch').value=searchQuery;searchClear.classList.toggle('visible',searchQuery.length>0);renderList(currentHeure,searchQuery);if(searchQuery.length>0)openDrawer();});
searchClear.addEventListener('click',()=>{searchInput.value='';searchQuery='';document.getElementById('drawerSearch').value='';searchClear.classList.remove('visible');renderList(currentHeure,'');});
document.getElementById('drawerSearch').addEventListener('input',e=>{searchQuery=e.target.value;searchInput.value=searchQuery;searchClear.classList.toggle('visible',searchQuery.length>0);renderList(currentHeure,searchQuery);});

const slider=document.getElementById('timeSlider');
slider.addEventListener('input',e=>{
  const val=parseFloat(e.target.value),h=Math.floor(val),m=Math.round((val-h)*60);
  document.getElementById('heureAffichee').textContent=h+'h'+(m<10?'0'+m:m);
  slider.style.setProperty('--pct',((val-8)/13)*100+'%');
  currentDate=new Date(); currentDate.setHours(h-2,m,0,0);
  viewer.clock.currentTime=Cesium.JulianDate.fromDate(currentDate); currentHeure=val;
});
slider.addEventListener('touchend',e=>{if(terrasses.length>0)scheduleShadow();});

const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
handler.setInputAction(click=>{
  const picked=viewer.scene.pick(click.position);
  if(Cesium.defined(picked)&&picked.id){const id=picked.id.properties?.id?.getValue();const t=terrasses.find(x=>String(x.id)===String(id));if(t){showTooltip(t,click.position.x,click.position.y);return;}}
  hideTooltip();
},Cesium.ScreenSpaceEventType.LEFT_CLICK);

async function loadTerrasses(){
  document.getElementById('loadingState').style.display='flex';
  document.getElementById('terrasseList').style.display='none';
  try {
    const data=await fetchTerrasses();
    document.getElementById('loadingState').style.display='none';
    document.getElementById('terrasseList').style.display='block';
    terrasses=data;
    terrasses.forEach(t=>{sunStates[t.id]=true;});
    document.getElementById('footerText').textContent=`${terrasses.length} terrasses · ${currentCity.nom}`;
    renderList(currentHeure,'');
   const launch=()=>{
  syncDots();
  runShadow();
};
    if(splashDone) launch();
    else{const w=setInterval(()=>{if(splashDone){clearInterval(w);launch();}},100);}
  }catch(e){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('terrasseList').style.display='block';
    document.getElementById('terrasseList').innerHTML=`<div class="no-results">Impossible de charger les terrasses.<br><button onclick="loadTerrasses()" style="margin-top:8px;background:#FFD600;border:none;padding:10px 20px;border-radius:12px;font-weight:600;cursor:pointer;font-size:14px;">🔄 Réessayer</button></div>`;
  }
}

async function init(){
  const now=new Date();
  const initH=Math.min(21,Math.max(8,now.getHours()+(Math.round(now.getMinutes()/15)*15/60)));
  slider.value=initH;
  slider.dispatchEvent(new Event('input'));
  loadTerrasses();
}

init();
</script>
