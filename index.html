<!DOCTYPE html><html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soleilenterrasse">
  <meta name="format-detection" content="telephone=no">
  <title>Soleilenterrasse</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #F8C83E; --yellow-2: #FFE07A; --yellow-bg: #FFF7D6;
      --shade: #7C8798; --shade-bg: #EDF1F6;
      --blue: #1677FF; --green: #1FA774; --coral: #F05E4B;
      --text: #15171A; --text-2: #5E6470; --text-3: #9AA1AD;
      --divider: #E4E7EC; --panel-w: 380px;
      --radius-md: 12px; --radius-sm: 8px;
      --glass: rgba(255,255,255,0.9);
      --white: #FFFFFF; --bg: #F6F7F9;
      --shadow-soft: 0 14px 38px rgba(15, 23, 42, 0.13);
      --shadow-card: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .panel-map input[type=range] { touch-action: pan-x; }
    #cesiumContainer { touch-action: none; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: #000; position: fixed; inset: 0; color: var(--text); }

    #splash { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    .splash-sun { width: 90px; height: 90px; margin-bottom: 24px; animation: splash-pulse 2.5s ease-in-out infinite; }
    @keyframes splash-pulse { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.07) rotate(6deg);} }
    .splash-name { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 8px; }
    .splash-name em { font-family: Arial, sans-serif; font-style: italic; font-weight: 700; }
    .splash-name span { font-family: Arial, sans-serif; font-style: normal; font-weight: 700; }
    .splash-tagline { font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.5; max-width: 220px; font-family: Arial, sans-serif; }
    .splash-tagline strong { color: var(--yellow); font-weight: 600; }
    .splash-progress-wrap { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); width: 140px; }
    .splash-progress-track { width: 100%; height: 2px; background: #E5E5EA; border-radius: 2px; overflow: hidden; }
    .splash-progress-bar { height: 100%; border-radius: 2px; background: var(--yellow); width: 0%; transition: width 0.25s ease; }
    .splash-status { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-3); white-space: nowrap; }

    #cesiumContainer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    .cesium-widget canvas { outline: none !important; }
    .cesium-selection-wrapper, .cesium-infoBox { display: none !important; }
    .cesium-widget-credits { display: none !important; }

    #topBar {
      position: fixed; top: calc(env(safe-area-inset-top, 44px) + 12px); left: 50%;
      transform: translate3d(-50%, 0, 0); -webkit-transform: translate3d(-50%, 0, 0);
      will-change: transform; isolation: isolate; z-index: 30;
      width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; gap: 10px;
    }
    .search-glass {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--glass); backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border-radius: 16px; padding: 0 14px; height: 52px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      border: 1px solid rgba(255,255,255,0.72);
    }
    .search-glass svg { flex-shrink: 0; opacity: 0.35; }
    #searchInput { flex: 1; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--text); outline: none; }
    #searchInput::placeholder { color: var(--text-3); }
    .search-clear-btn { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 16px; padding: 0; display: none; align-items: center; justify-content: center; width: 20px; height: 20px; }
    .search-clear-btn.visible { display: flex; }
    .icon-btn {
      flex-shrink: 0; width: 52px; height: 52px; background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.6); border-radius: 15px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease; -webkit-transform: translate3d(0, 0, 0);
      will-change: transform; isolation: isolate;
    }
    .icon-btn:hover { transform: translateY(-1px); }
    .icon-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.98); }

    /* Bouton géoloc flottant en bas à droite */
    #btnGeo {
      position: fixed; bottom: calc(env(safe-area-inset-bottom,34px) + 140px); right: 16px;
      z-index: 31; width: 50px; height: 50px;
      background: var(--glass); backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.6); border-radius: 15px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }
    #btnGeo:active { transform: scale(0.94); background: rgba(255,255,255,0.98); }
    #btnGeo.locating { animation: geo-pulse 1s ease-in-out infinite; }
    @keyframes geo-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .panel-map {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 34px) + 16px); left: 50%;
      transform: translateX(-50%); background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.7); padding: 16px 24px 14px; border-radius: 22px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      text-align: center; z-index: 30; width: 82%; max-width: 400px;
    }
    .panel-map h3 { margin: 0 0 12px 0; font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .panel-map h3 .heure { font-size: 18px; font-weight: 800; color: var(--text); font-family: inherit; }
    .panel-map input[type=range] { width: 100%; cursor: pointer; -webkit-appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--yellow) var(--pct,46%), rgba(0,0,0,0.1) var(--pct,46%)); outline: none; }
    .panel-map input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; border: 3px solid var(--yellow); box-shadow: 0 4px 16px rgba(0,0,0,0.18); cursor: pointer; }
    .panel-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text-3); font-weight: 500; }

    #tooltip { position: fixed; z-index: 50; background: rgba(20,20,22,0.93); color: white; padding: 12px 18px; border-radius: 16px; font-size: 15px; font-weight: 600; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity 0.18s, transform 0.18s; backdrop-filter: blur(12px); max-width: 260px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
    #tooltip.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #tooltip .tt-type { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; font-weight: 400; font-family: Arial, sans-serif; }
    #tooltip .tt-sun { font-size: 13px; font-weight: 600; margin-top: 6px; font-family: Arial, sans-serif; }
    #tooltip .tt-sun.sun { color: var(--yellow); }
    #tooltip .tt-sun.shade { color: #90CAF9; }

    #drawer { position: fixed; z-index: 40; background: linear-gradient(180deg, rgba(255,255,255,0.98), #F8FAFC 46%, #F5F7FA); display: flex; flex-direction: column; transition: transform 0.42s cubic-bezier(0.22,0.9,0.18,1); box-shadow: -22px 0 48px rgba(15,23,42,0.16); }
    @media (min-width: 641px) { #drawer { top:0; right:0; width:var(--panel-w); height:100vh; border-left:1px solid rgba(255,255,255,0.6); transform:translateX(110%); } #drawer.open { transform:translateX(0); } }
    @media (max-width: 640px) { #drawer { left:0; bottom:0; width:100%; height:84vh; border-radius:20px 20px 0 0; border-top:1px solid rgba(255,255,255,0.75); box-shadow:0 -18px 52px rgba(15,23,42,0.2); transform:translateY(110%); } #drawer.open { transform:translateY(0); } }
    .drawer-handle { display:none; justify-content:center; padding:12px 0 4px; flex-shrink:0; cursor:pointer; }
    .drawer-bar { width:40px; height:4px; background:#E0E0E5; border-radius:2px; }
    @media (max-width:640px) { .drawer-handle { display:flex; } }
    .drawer-header { padding:20px 20px 0; flex-shrink:0; }
    .drawer-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .drawer-title { font-size: 22px; font-weight: 800; color: var(--text); }
    .drawer-title em { font-family: inherit; font-style: italic; font-weight: 800; }
    .drawer-title span { font-family: inherit; font-style: normal; color: var(--yellow); font-weight: 800; }
    #btnClose { background: var(--bg); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: background 0.15s; }
    #btnClose:active { background: #E5E5EA; }
    .drawer-search { display: flex; align-items: center; gap: 8px; background: var(--white); border:1px solid rgba(226,232,240,0.9); border-radius: 12px; padding: 0 12px; height: 42px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
    .drawer-search svg { flex-shrink: 0; opacity: 0.3; }
    #drawerSearch { flex: 1; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--text); outline: none; }
    #drawerSearch::placeholder { color: var(--text-3); }
    .filter-chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px 12px; flex-shrink:0; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .filter-chips::-webkit-scrollbar { display:none; }
    .filter-chip { flex:0 0 auto; border:1px solid var(--divider); background:rgba(255,255,255,0.78); color:var(--text-2); border-radius:999px; height:32px; padding:0 12px; font-size:12px; font-weight:750; cursor:pointer; box-shadow:0 3px 10px rgba(15,23,42,0.04); transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
    .filter-chip:hover { transform: translateY(-1px); }
    .filter-chip.active { background:var(--text); color:#fff; border-color:var(--text); }
    .section-title { padding:4px 20px 10px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .section-label { font-size:11px; font-weight:750; color:var(--text-3); text-transform:uppercase; letter-spacing:0.8px; }
    .count-pill { font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; background:var(--text); color:#fff; }
    #loadingState { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-3); font-size:13px; }
    .spinner { width:24px; height:24px; border:2.5px solid var(--divider); border-top-color:var(--yellow); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .list { flex:1; overflow-y:auto; padding:0 12px 32px; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-behavior:smooth; }
    .list::-webkit-scrollbar { display:none; }
    .card { display:flex; align-items:center; gap:12px; padding:10px; border-radius:var(--radius-md); cursor:pointer; transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease; border:1px solid rgba(226,232,240,0.78); background:rgba(255,255,255,0.86); margin-bottom:9px; box-shadow:0 5px 18px rgba(15,23,42,0.055); }
    .card:last-child { margin-bottom:0; }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .card:active, .card.active { transform: scale(0.985); background:var(--white); border-color:rgba(248,200,62,0.75); box-shadow:0 10px 28px rgba(248,200,62,0.16); }
    .card-photo-wrap { position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden; flex-shrink:0; background:linear-gradient(135deg,#FFF7D6,#E7EEF8); }
    .card-photo { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.01); transition:transform 0.2s ease; }
    .photo-error .card-photo, .photo-error .sel-photo, .photo-error .ps-photo { display:none; }
    .photo-error::before { content:'☀️'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; }
    .card:hover .card-photo { transform:scale(1.06); }
    .card-status { position:absolute; right:5px; bottom:5px; min-width:26px; height:24px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:12px; background:rgba(255,255,255,0.9); box-shadow:0 4px 10px rgba(15,23,42,0.18); }
    .card-status.sun { color:#9A7200; }
    .card-status.shade { color:var(--shade); }
    .card-time { font-size:11px; font-weight:750; margin-top:4px; }
    .card-time.sun { color:#A17600; }
    .card-time.shade { color:var(--shade); }
    .card-body { flex:1; min-width:0; }
    .card-name { font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; font-family: inherit; }
    .card-sub { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family: inherit; }
    .no-results { padding:40px 20px; text-align:center; color:var(--text-3); font-size:13px; line-height:1.7; }
    .drawer-footer { padding:12px 20px; border-top:1px solid rgba(226,232,240,0.9); display:flex; align-items:center; gap:6px; flex-shrink:0; background:rgba(255,255,255,0.75); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .footer-text { font-size:10px; color:var(--text-3); }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#30D158; animation:blink 2s ease-in-out infinite; flex-shrink:0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .privacy-link { margin-left:auto; font-size:10px; color:var(--text-3); cursor:pointer; text-decoration:none; }

    /* ══ FICHE LIEU (bottom sheet) ══ */
    #psOverlay { position: fixed; inset: 0; z-index: 49; background: rgba(10,14,20,0.48); opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    #psOverlay.open { opacity: 1; pointer-events: auto; }
    #placeSheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--white); border-radius: 22px 22px 0 0; box-shadow: 0 -24px 70px rgba(15,23,42,0.28); transform: translateY(110%); transition: transform 0.42s cubic-bezier(0.22,0.9,0.18,1); overflow: hidden; max-height: 90vh; padding-bottom: env(safe-area-inset-bottom, 16px); }
    #placeSheet.open { transform: translateY(0); }
    .ps-handle { display: flex; justify-content: center; padding: 12px 0 6px; cursor: pointer; flex-shrink: 0; }
    .ps-bar { width: 40px; height: 4px; background: #E0E0E5; border-radius: 2px; }
    .ps-hero { position:relative; min-height:210px; background:linear-gradient(135deg,#1E293B,#475569); overflow:hidden; }
    .ps-photo { width: 100%; height: 230px; object-fit: cover; display: block; background: var(--bg); }
    .ps-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(5,10,18,0.02) 18%,rgba(5,10,18,0.5) 100%); pointer-events:none; }
    .ps-photo-placeholder { width: 100%; height: 210px; background: linear-gradient(135deg,#FFF7D6,#DCEBFA); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .ps-hero-chip { position:absolute; left:16px; bottom:14px; z-index:1; display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:7px 12px; background:rgba(255,255,255,0.9); color:var(--text); font-size:12px; font-weight:800; box-shadow:0 8px 24px rgba(15,23,42,0.18); }
    .ps-body { padding: 16px 20px 20px; }
    .ps-badge { display:inline-flex; align-items:center; gap:5px; background:linear-gradient(135deg,var(--yellow),var(--yellow-2)); color:#775400; font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }
    .ps-sun { font-size: 13px; font-weight: 700; margin-bottom: 6px; font-family: inherit; }
    .ps-sun.sun { color: #9A7200; }
    .ps-sun.shade { color: var(--shade); }
    .ps-name { font-size: 24px; font-weight: 850; color: var(--text); margin-bottom: 4px; line-height: 1.14; font-family: inherit; }
    .ps-sub { font-size: 13px; color: var(--text-2); margin-bottom: 12px; line-height:1.45; font-family: inherit; }
    .ps-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
    .ps-rating { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 750; color: var(--text); }
    .ps-happy { display:inline-flex; align-items:center; gap:5px; background:#FFF3D6; color:#9A6B00; border-radius:20px; padding:6px 12px; font-size:13px; font-weight:750; }
    .ps-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .ps-btn { flex: 1; min-width: 0; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; text-align: center; font-family: inherit; white-space: nowrap; transition: transform 0.14s ease, opacity 0.14s ease; }
    .ps-btn:active { opacity: 0.82; transform:scale(0.98); }
    .ps-btn.reserve { background: var(--coral); color: white; flex-basis: 100%; }
    .ps-btn.site { background: #2D3340; color: white; flex-basis: 100%; }
    .ps-btn.maps { background: var(--blue); color: white; }
    .ps-btn.tel { background: var(--green); color: white; }
    .ps-spinner-wrap { display: flex; align-items: center; justify-content: center; height: 210px; background:linear-gradient(135deg,#FFF7D6,#DCEBFA); }

    /* Carte partenaire dans la liste */
    .card.partner { background:linear-gradient(135deg,#FFFFFF,#FFF9E8); border-color:#F6D86B; }
    .card.partner .card-name::after { content:'⭐'; margin-left:5px; font-size:12px; }
    .partner-tag { font-size:10px; font-weight:800; color:#8A6400; background:#FFE58A; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }

    /* Section "Sélection" — carrousel horizontal de cafés référencés */
    .sel-wrap { padding: 6px 0 12px; }
    .sel-head { padding: 6px 20px 10px; display:flex; align-items:center; gap:7px; }
    .sel-head .sel-title { font-size:15px; font-weight:700; color:var(--text); }
    .sel-head .sel-emoji { font-size:16px; }
    .sel-scroll { display:flex; gap:12px; overflow-x:auto; padding:2px 16px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .sel-scroll::-webkit-scrollbar { display:none; }
    .sel-card { flex:0 0 218px; background:var(--white); border:1px solid rgba(226,232,240,0.86); border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow-card); transition:transform 0.14s ease, box-shadow 0.14s ease; }
    .sel-card:hover { transform:translateY(-1px); }
    .sel-card:active { transform:scale(0.98); }
    .sel-photo-wrap { position:relative; width:100%; height:118px; background:linear-gradient(135deg,#FFF7D6,#DCEBFA); overflow:hidden; }
    .sel-photo { width:100%; height:118px; object-fit:cover; display:block; background:var(--bg); }
    .sel-photo-ph { width:100%; height:118px; background:linear-gradient(135deg,#FFF7D6,#DCEBFA); display:flex; align-items:center; justify-content:center; font-size:34px; }
    .sel-info { padding:10px 12px 12px; }
    .sel-name { font-size:14px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sel-sub { font-size:11px; color:var(--text-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sel-status { font-size:11px; font-weight:700; margin-top:6px; }
    .sel-status.sun { color:#C99700; }
    .sel-status.shade { color:var(--shade); }
    .sel-happy { display:inline-block; margin-top:6px; font-size:10px; font-weight:600; color:#9A6B00; background:#FFF3D6; padding:2px 7px; border-radius:8px; }
    .list-divider { padding: 10px 20px 6px; font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.8px; }

    /* Timeline soleil dans la fiche */
    .ps-timeline-wrap { margin: 4px 0 16px; }
    .ps-timeline-label { font-size:11px; color:var(--text-3); margin-bottom:6px; font-weight:600; }

    @media (min-width: 700px) {
      #placeSheet { left:50%; right:auto; width:min(520px, calc(100% - 32px)); transform:translate(-50%, 110%); border-radius:22px; bottom:18px; padding-bottom:0; }

      *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:0.01ms !important; }
    }
  </style>
</head>

<script>
const CITIES = [
  {id:'bordeaux',   nom:'Bordeaux',    lat:44.837789, lng:-0.57918 },
  {id:'marseille',  nom:'Marseille',   lat:43.296482, lng:5.381118 },
  {id:'lyon',       nom:'Lyon',        lat:45.764043, lng:4.835659 },
  {id:'toulouse',   nom:'Toulouse',    lat:43.604652, lng:1.444209 },
  {id:'nice',       nom:'Nice',        lat:43.710173, lng:7.262011 },
  {id:'cannes',     nom:'Cannes',      lat:43.552847, lng:7.017369 },
  {id:'nantes',     nom:'Nantes',      lat:47.218371, lng:-1.553621},
  {id:'strasbourg', nom:'Strasbourg',  lat:48.573405, lng:7.752111 },
  {id:'montpellier',nom:'Montpellier', lat:43.610769, lng:3.876716 },
  {id:'lille',      nom:'Lille',       lat:50.629250, lng:3.057256 },
];
let currentCity = CITIES[0];
let userLat = null, userLng = null;

// Plus de menu villes : la ville la plus proche est detectee automatiquement par GPS

const drawer = document.getElementById('drawer');
function openDrawer()  { drawer.classList.add('open'); }
function closeDrawer() { drawer.classList.remove('open'); }
const dhandle = document.getElementById('drawerHandle');
let ty0 = 0;
dhandle.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive:true });
dhandle.addEventListener('touchend',   e => { if (e.changedTouches[0].clientY - ty0 > 50) closeDrawer(); }, { passive:true });

const progressBar = document.getElementById('progressBar');
let splashDone = false, loadProgress = 0;
function setProgress(pct, label) {
  loadProgress = Math.max(loadProgress, pct);
  progressBar.style.width = loadProgress + '%';
  if (label) document.getElementById('splashStatus').textContent = label;
}
function completeSplash() {
  if (splashDone) return; splashDone = true; setProgress(100, 'Prêt !');
  setTimeout(() => { document.getElementById('splash').classList.add('out'); setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 650); }, 300);
}
setTimeout(completeSplash, 8000);

Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwM2M0Njk1Yi1iYzI1LTQ3MzAtOGU1MS1iNzU4MTRiNWVkY2QiLCJpZCI6Mzk5MDg5LCJpYXQiOjE3NzI3ODI3NTh9.aGJt8zcDKPwk-pJsAcp0egE1wgJ5Vg41y_yQKNfUtYw';

const viewer = new Cesium.Viewer('cesiumContainer', {
  terrainProvider: Cesium.createWorldTerrain(), skyBox: false, skyAtmosphere: false,
  baseLayerPicker: false, homeButton: false, infoBox: false, selectionIndicator: false,
  navigationHelpButton: false, sceneModePicker: false, animation: false, timeline: false,
  fullscreenButton: false, geocoder: false, scene3DOnly: true,
});
viewer.scene.globe.maximumScreenSpaceError = 1;
viewer.scene.globe.tileCacheSize = 500;
viewer.scene.globe.preloadAncestors = true;
viewer.scene.globe.preloadSiblings = false;
viewer.scene.globe.enableLighting = true;
viewer.scene.fog.enabled = false;
viewer.shadows = true;
viewer.resolutionScale = window.devicePixelRatio || 1;
viewer.scene.globe.showWaterEffect = false;
viewer.scene.postProcessStages.fxaa.enabled = false;
viewer.scene.screenSpaceCameraController.inertiaSpin = 0.9;
viewer.scene.screenSpaceCameraController.inertiaTranslate = 0.9;
viewer.scene.screenSpaceCameraController.inertiaZoom = 0.8;
viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(-0.57918, 44.837789, 450), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-50), roll: 0 } });

setProgress(10, 'Chargement…');
const osmBuildings = viewer.scene.primitives.add(Cesium.createOsmBuildings());
osmBuildings.maximumScreenSpaceError = 2;
viewer.scene.globe.tileLoadProgressEvent.addEventListener(remaining => {
  setProgress(Math.min(60, 10 + (1 - Math.min(remaining, 50) / 50) * 50), remaining === 0 ? 'Bâtiments…' : 'Chargement…');
  if (remaining === 0 && terrasses.length > 0 && !computing) { scheduleShadow(); }
});
let globeOk = false, buildingsOk = false;
function tryOpen() {
  if (!globeOk || !buildingsOk) return;
  let f = 0;
  viewer.scene.postRender.addEventListener(function waitRender() { if (++f >= 6) { viewer.scene.postRender.removeEventListener(waitRender); completeSplash(); } });
}
viewer.scene.postRender.addEventListener(function watchGlobe() {
  if (viewer.scene.globe.tilesLoaded && !globeOk) { globeOk = true; setProgress(70, 'Bâtiments…'); viewer.scene.postRender.removeEventListener(watchGlobe); tryOpen(); }
});
osmBuildings.readyPromise.then(() => { buildingsOk = true; setProgress(85, 'Finalisation…'); tryOpen(); }).catch(() => { buildingsOk = true; tryOpen(); });

let userDot = null, userHalo = null, userPulse = null, pulseT = 0, pulseStarted = false;
function makeUserDot() {
  const c = document.createElement('canvas'); c.width = 32; c.height = 32; const ctx = c.getContext('2d');
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
  ctx.beginPath(); ctx.arc(16,16,10,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(16,16,7.5,0,Math.PI*2); ctx.fillStyle='#007AFF'; ctx.fill();
  return c.toDataURL();
}
function placeUserDot(lng, lat, accuracy) {
  if (userDot) viewer.entities.remove(userDot);
  if (userHalo) viewer.entities.remove(userHalo);
  if (userPulse) viewer.entities.remove(userPulse);
  const pos = Cesium.Cartesian3.fromDegrees(lng, lat, 1);

  // Rond bleu de précision (taille = précision GPS réelle, comme Apple Plans)
  const radius = Math.min(Math.max(accuracy || 35, 20), 200);
  userHalo = viewer.entities.add({
    position: pos,
    ellipse: {
      semiMajorAxis: radius, semiMinorAxis: radius,
      material: Cesium.Color.fromCssColorString('rgba(0,122,255,0.15)'),
      outline: true, outlineColor: Cesium.Color.fromCssColorString('rgba(0,122,255,0.4)'), outlineWidth: 2,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });

  // Anneau pulsant
  userPulse = viewer.entities.add({
    position: pos,
    ellipse: {
      semiMajorAxis: new Cesium.CallbackProperty(() => 8 + 18 * (pulseT % 1), false),
      semiMinorAxis: new Cesium.CallbackProperty(() => 8 + 18 * (pulseT % 1), false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => Cesium.Color.fromCssColorString('#007AFF').withAlpha(0.4 * (1 - (pulseT % 1))), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });
  if (!pulseStarted) { pulseStarted = true; viewer.clock.onTick.addEventListener(() => { pulseT += 0.012; }); }

  // Point bleu central
  userDot = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lng, lat, 3),
    billboard: { image: makeUserDot(), verticalOrigin: Cesium.VerticalOrigin.CENTER, heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, width: 32, height: 32, disableDepthTestDistance: Number.POSITIVE_INFINITY }
  });
  userLat = lat; userLng = lng;
}

// Centre la caméra EXACTEMENT sur la position (le rond bleu au centre de l'écran)
// flyToBoundingSphere cale le centre de la sphère au centre de l'écran, même avec la vue inclinée
function focusUser(lng, lat, animate) {
  const sphere = new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(lng, lat, 0), 45);
  const hpr = new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-55), 300);
  viewer.camera.flyToBoundingSphere(sphere, { offset: hpr, duration: animate ? 1.2 : 0 });
}

// Géolocalisation manuelle (bouton) — recentre sur la position réelle
function geolocate(e) {
  if(e) e.preventDefault();
  if (!navigator.geolocation) { alert("Géolocalisation non disponible"); return; }
  const btn = document.getElementById('btnGeo'); btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('locating');
    const { longitude:lng, latitude:lat, accuracy } = pos.coords;
    placeUserDot(lng, lat, accuracy);
    const nearest = CITIES.reduce((best, city) => {
      const d = Math.hypot(city.lat-lat, city.lng-lng);
      return d < Math.hypot(best.lat-lat, best.lng-lng) ? city : best;
    });
    if (nearest.id !== currentCity.id) {
      currentCity = nearest;
      Object.keys(markerEntities).forEach(k => { viewer.entities.remove(markerEntities[k]); delete markerEntities[k]; });
      terrasses = []; sunStates = {};
      loadTerrasses();
    } else {
      renderList(currentHeure, searchQuery);
    }
    focusUser(lng, lat, true);
  }, err => {
    btn.classList.remove('locating');
    alert("Position introuvable. Vérifiez que la localisation est autorisée.");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
}

let terrasses=[], sunStates={}, searchQuery='', activeFilter='all', currentHeure=14, currentDate=new Date();
const markerEntities={};

const AMENITY_VALIDES = new Set(['bar','cafe','restaurant','pub','biergarten']);
function typeLabel(a){return{bar:'Bar',cafe:'Café',restaurant:'Restaurant',pub:'Pub',biergarten:'Brasserie'}[a]||'Terrasse';}

const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function fetchTerrasses(){
  try {
    const res = await fetch(`/data/${currentCity.id}.json`);
    if(!res.ok) throw new Error();
    const data = await res.json();
    const seen = new Set();
    return (data.features || data.elements || [])
      .filter(f => {
        const amenity = f.properties?.amenity || f.tags?.amenity;
        const name = f.properties?.name || f.tags?.name;
        return AMENITY_VALIDES.has(amenity) && name && !seen.has(name) && seen.add(name);
      })
      .map(f => {
        const isGeoJSON = !!f.geometry;
        return {
          id: f.properties?.['@id'] || f.properties?.id || f.id || Math.random(),
          nom: f.properties?.name || f.tags?.name,
          adresse: isGeoJSON
            ? (f.properties?.['addr:street'] ? ((f.properties?.['addr:housenumber']||'')+' '+f.properties?.['addr:street']).trim() : '')
            : (f.tags?.['addr:street'] ? ((f.tags?.['addr:housenumber']||'')+' '+f.tags?.['addr:street']).trim() : ''),
          type: typeLabel(isGeoJSON ? f.properties?.amenity : f.tags?.amenity),
          lng: isGeoJSON ? f.geometry.coordinates[0] : f.lon,
          lat: isGeoJSON ? f.geometry.coordinates[1] : f.lat
        };
      })
      .filter(f => f.lat && f.lng);
  } catch(e) {
    const bbox=`${currentCity.lat-0.04},${currentCity.lng-0.06},${currentCity.lat+0.04},${currentCity.lng+0.06}`;
    const q=`[out:json][timeout:25];(node["amenity"~"bar|cafe|restaurant|pub|biergarten"](${bbox}););out body;`;
    for(const url of OVERPASS){try{const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)throw new Error();const d=await r.json();const seen=new Set();return(d.elements||[]).filter(el=>el.lat&&el.lon&&el.tags?.name&&!seen.has(el.tags.name)&&seen.add(el.tags.name)).slice(0,150).map(el=>({id:el.id,nom:el.tags.name,adresse:el.tags['addr:street']?((el.tags['addr:housenumber']||'')+' '+el.tags['addr:street']).trim():'',type:typeLabel(el.tags.amenity),lng:el.lon,lat:el.lat}));}catch(e){}}
    return [];
  }
}

function getSunDir(jd){
  const s=Cesium.Simon1994PlanetaryPositions.computeSunPositionInEarthInertialFrame(jd);
  const m=Cesium.Transforms.computeIcrfToFixedMatrix(jd); if(!m) return null;
  const d=new Cesium.Cartesian3(); Cesium.Matrix3.multiplyByVector(m,s,d); return Cesium.Cartesian3.normalize(d,d);
}
function checkSunny(t,sunDir){
  if(!sunDir) return false;
  const carto=Cesium.Cartographic.fromDegrees(t.lng,t.lat);
  const terrainH=viewer.scene.globe.getHeight(carto)||0;
  const pos=Cesium.Cartesian3.fromDegrees(t.lng,t.lat,terrainH+2);
  const up=Cesium.Cartesian3.normalize(pos,new Cesium.Cartesian3());
  if(Cesium.Cartesian3.dot(sunDir,up)<=0.0) return false;
  return !viewer.scene.pickFromRay(new Cesium.Ray(pos,sunDir),Object.values(markerEntities));
}

let cameraMoving=false;
viewer.camera.moveStart.addEventListener(()=>{cameraMoving=true;});
viewer.camera.moveEnd.addEventListener(()=>{cameraMoving=false;});

let shadowDebounce=null,computing=false,shadowVersion=0;
const sunChange={}; // minutes avant changement soleil/ombre par terrasse
function scheduleShadow(){
  clearTimeout(shadowDebounce);
  shadowDebounce=setTimeout(()=>{
    if(cameraMoving) return;
    const unsub=viewer.scene.postRender.addEventListener(()=>{ unsub(); runShadow(); });
  }, 150);
}
async function runShadow(){
  if(computing) return; computing=true; const version=++shadowVersion;
  const jd=viewer.clock.currentTime; const sunDir=getSunDir(jd);
  for(let i=0;i<terrasses.length;i+=30){
    if(version!==shadowVersion||cameraMoving){computing=false;return;}
    for(const t of terrasses.slice(i,i+30)) sunStates[t.id]=checkSunny(t,sunDir);
    syncDots();
    await new Promise(r=>setTimeout(r,0));
  }
  // Une seule reconstruction de la liste à la fin (évite le clignotement)
  renderList(currentHeure,searchQuery);
  computing=false;
  // Calcul des comptes à rebours en arrière-plan (non bloquant)
  computeCountdowns(version);
}

// Met à jour juste le texte "encore Xh" d'une carte, sans reconstruire la liste (zéro clignotement)
function updateCardTime(t){
  const card=document.querySelector(`.card[data-id="${CSS.escape(String(t.id))}"] .card-time`);
  if(!card) return;
  const isSun=sunStates[t.id]===true;
  const dur=formatDuration(sunChange[t.id]);
  card.className='card-time '+(isSun?'sun':'shade');
  card.textContent=isSun?('☀️ '+(dur?'encore '+dur+' de soleil':'au soleil')):('🌑 '+(dur?'soleil dans '+dur:'à l’ombre'));
}

// Pour chaque terrasse, calcule dans combien de temps elle passe soleil<->ombre
async function computeCountdowns(version){
  const base=currentDate.getTime();
  for(let i=0;i<terrasses.length;i+=8){
    if(version!==shadowVersion) return; // on n'annule que si un nouveau calcul a démarré
    const batch=terrasses.slice(i,i+8);
    for(const t of batch){
      const now=sunStates[t.id]===true;
      let change=null;
      for(let m=20;m<=300;m+=20){ // pas de 20 min jusqu'à 5h
        const future=new Date(base+m*60000);
        const fdir=getSunDir(Cesium.JulianDate.fromDate(future));
        if(checkSunny(t,fdir)!==now){ change=m; break; }
      }
      sunChange[t.id]=change;
    }
    // Mise à jour immédiate du texte des cartes de ce lot (sans rebuild → pas de clignotement)
    batch.forEach(updateCardTime);
    await new Promise(r=>setTimeout(r,0));
  }
}

function formatDuration(min){
  if(!min) return null;
  if(min<60) return min+' min';
  const h=Math.floor(min/60),m=min%60;
  return m>0?h+'h'+(m<10?'0'+m:m):h+'h';
}

function makeSunIcon(sunny){
  const c=document.createElement('canvas'); c.width=20; c.height=20; const ctx=c.getContext('2d');
  if(sunny){
    ctx.strokeStyle='#FFD600'; ctx.lineWidth=1.5; ctx.lineCap='round';
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(10+Math.cos(a)*6.5,10+Math.sin(a)*6.5);ctx.lineTo(10+Math.cos(a)*9,10+Math.sin(a)*9);ctx.stroke();}
    ctx.beginPath();ctx.arc(10,10,4.5,0,Math.PI*2);ctx.fillStyle='#FFD600';ctx.fill();
    ctx.beginPath();ctx.arc(10,10,4.5,0,Math.PI*2);ctx.strokeStyle='white';ctx.lineWidth=1.5;ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(10,10,5,0,Math.PI*2);ctx.fillStyle='#8E9BAD';ctx.fill();
    ctx.beginPath();ctx.arc(10,10,5,0,Math.PI*2);ctx.strokeStyle='white';ctx.lineWidth=1.5;ctx.stroke();
  }
  return c.toDataURL();
}

// Marqueur plus gros et mis en avant pour les cafés référencés
function makeRefIcon(sunny){
  const c=document.createElement('canvas'); c.width=46; c.height=46; const ctx=c.getContext('2d');
  // halo doré
  ctx.beginPath(); ctx.arc(23,23,21,0,Math.PI*2); ctx.fillStyle='rgba(248,200,62,0.28)'; ctx.fill();
  // disque blanc + contour doré
  ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=4; ctx.shadowOffsetY=1;
  ctx.beginPath(); ctx.arc(23,23,15,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.shadowColor='transparent';
  ctx.lineWidth=2.5; ctx.strokeStyle=sunny?'#F5A700':'#9AA8BC'; ctx.beginPath(); ctx.arc(23,23,15,0,Math.PI*2); ctx.stroke();
  if(sunny){
    ctx.strokeStyle='#F5A700'; ctx.lineWidth=2.2; ctx.lineCap='round';
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(23+Math.cos(a)*8.5,23+Math.sin(a)*8.5);ctx.lineTo(23+Math.cos(a)*11.5,23+Math.sin(a)*11.5);ctx.stroke();}
    ctx.beginPath(); ctx.arc(23,23,6.5,0,Math.PI*2); ctx.fillStyle='#FFC400'; ctx.fill();
  }else{
    ctx.beginPath(); ctx.arc(23,23,7,0,Math.PI*2); ctx.fillStyle='#8E9BAD'; ctx.fill();
  }
  return c.toDataURL();
}

function hashString(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=((h<<5)-h+str.charCodeAt(i))|0;
  return Math.abs(h);
}

const fsqCache={};

// ══ Timeline soleil : pour 1 café, calcule l'ensoleillement heure par heure (6h→21h) ══
function computeSunTimeline(t){
  const base=new Date(currentDate); base.setHours(0,0,0,0);
  const tzOffset=-(new Date().getTimezoneOffset())/60;
  const segs=[];
  for(let hour=6; hour<=21; hour++){
    const d=new Date(base); d.setUTCHours(hour-tzOffset,0,0,0);
    const dir=getSunDir(Cesium.JulianDate.fromDate(d));
    segs.push(checkSunny(t,dir));
  }
  return segs; // tableau de 16 booléens (6h..21h)
}

// Affiche la timeline UNE FOIS les bâtiments 3D autour du café chargés (sinon résultat faux)
function renderTimelineWhenReady(t){
  let tries=0;
  const draw=()=>{
    const wrap=document.getElementById('psTimeline');
    if(!wrap) return false; // fiche fermée
    const tl=computeSunTimeline(t);
    wrap.innerHTML=tl.map(s=>`<div class="ps-tl-seg ${s?'sun':'shade'}"></div>`).join('');
    return true;
  };
  const tick=()=>{
    tries++;
    const ready = viewer.scene.globe.tilesLoaded && osmBuildings.tilesLoaded;
    if(!document.getElementById('psTimeline')) return; // fiche fermée, on arrête
    if(ready || tries>=20){ draw(); }     // dès que prêt (ou au bout de ~6s) on dessine
    if(!ready && tries<20){ setTimeout(tick, 300); }
  };
  tick();
}

function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function distMeters(lat,lng){if(userLat===null)return Infinity;return Math.hypot((lat-userLat)*111320,(lng-userLng)*111320*Math.cos(userLat*Math.PI/180));}
function distKm(lat,lng){if(userLat===null)return '';const d=distMeters(lat,lng)/1000;return d<1?Math.round(d*1000)+'m':d.toFixed(1)+'km';}
function highlight(text,q){
  const safe=escapeHTML(text);
  if(!q) return safe;
  const escaped=escapeHTML(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(`(${escaped})`,'gi'),'<mark style="background:#FFF7D6;color:#8A6400;border-radius:4px;padding:0 2px">$1</mark>');
}

function matchesActiveFilter(t){
  const type=normalize(t.type);
  if(activeFilter==='sun') return sunStates[t.id]===true;
  if(activeFilter==='restaurant') return type.includes('restaurant')||type.includes('brasserie')||type.includes('bistrot');
  if(activeFilter==='cafe') return type.includes('cafe');
  if(activeFilter==='bar') return type.includes('bar')||type.includes('pub');
  return true;
}

}

function renderList(h,query){
  const list=document.getElementById('terrasseList');
  const q=normalize(query||'');
  let filtered=terrasses.filter(matchesActiveFilter);
  if(q) filtered=filtered.filter(t=>normalize(t.nom).includes(q)||normalize(t.type).includes(q)||normalize(t.adresse).includes(q));
  // Tri : référencés d'abord, puis au soleil, puis par distance
  const sorted=[...filtered].sort((a,b)=>{
    const pa=findReferenced(a.nom)?1:0, pb=findReferenced(b.nom)?1:0;
    if(pa!==pb) return pb-pa;
    const sun=(sunStates[b.id]?1:0)-(sunStates[a.id]?1:0);
    if(sun!==0) return sun;
    return distMeters(a.lat,a.lng)-distMeters(b.lat,b.lng);
  });
  const counter=document.getElementById('resultCount');
  if(counter) counter.textContent=String(sorted.length);
  list.innerHTML='';
  const fragment=document.createDocumentFragment();

  // ── Section "Sélection" : uniquement les cafés référencés (avec photo) ──
  const refTerrasses = terrasses.filter(t=>findReferenced(t.nom)&&matchesActiveFilter(t));
  if(refTerrasses.length && !q){
    const wrap=document.createElement('div'); wrap.className='sel-wrap';
    wrap.innerHTML=`<div class="sel-head"><span class="sel-emoji">⭐</span><span class="sel-title">Notre sélection</span></div>`;
    const scroll=document.createElement('div'); scroll.className='sel-scroll';
    refTerrasses.forEach(t=>{
      const ref=findReferenced(t.nom);
      const isSun=sunStates[t.id]===true;
      const photo=`<div class="sel-photo-wrap"><img class="sel-photo" src="${escapeAttr(placePhotoUrl(t,ref,null))}" alt="${escapeAttr(t.nom)}" loading="lazy" decoding="async" onerror="markPhotoError(this)"></div>`;
      const happy=ref.happyHours?`<span class="sel-happy">🍹 ${escapeHTML(ref.happyHours)}</span>`:'';
      const c=document.createElement('div'); c.className='sel-card';
      c.innerHTML=`${photo}<div class="sel-info"><div class="sel-name">${escapeHTML(t.nom)}</div><div class="sel-sub">${escapeHTML(ref.type||t.type)}${ref.priceLevel?' · '+escapeHTML(ref.priceLevel):''}</div><div class="sel-status ${isSun?'sun':'shade'}">${isSun?'Au soleil':'A l’ombre'}</div>${happy}</div>`;
      c.addEventListener('click',()=>{ closeDrawer(); focusPlace(t); showPlaceSheet(t); });
      scroll.appendChild(c);
    });
    wrap.appendChild(scroll);
    fragment.appendChild(wrap);
    const divider=document.createElement('div'); divider.className='list-divider'; divider.textContent='Toutes les terrasses';
    fragment.appendChild(divider);
  }

  if(!sorted.length){const nr=document.createElement('div');nr.className='no-results';nr.innerHTML=`Aucun résultat${query?' pour <strong>"'+escapeHTML(query)+'"</strong>':''}`;fragment.appendChild(nr);list.appendChild(fragment);return;}
  sorted.forEach(t=>{
    const ref=findReferenced(t.nom);
    const card=document.createElement('div'); card.className='card'+(ref?' partner':''); card.dataset.id=t.id;
    const isSun=sunStates[t.id]===true;
    const dist=distKm(t.lat,t.lng);
    const dur=formatDuration(sunChange[t.id]);
    let timeLine='';
    if(isSun){
      timeLine=`<div class="card-time sun">☀️ ${dur?'encore '+dur+' de soleil':'au soleil'}</div>`;
    }else{
      timeLine=`<div class="card-time shade">🌑 ${dur?'soleil dans '+dur:'à l’ombre'}</div>`;
    }
    const tag=ref?`<span class="partner-tag">Sélection</span>`:'';
    const photo=placePhotoUrl(t,ref,null);
    card.innerHTML=`<div class="card-photo-wrap"><img class="card-photo" src="${escapeAttr(photo)}" alt="${escapeAttr(t.nom)}" loading="lazy" decoding="async" onerror="markPhotoError(this)"><div class="card-status ${isSun?'sun':'shade'}">${isSun?'☀️':'🌑'}</div></div><div class="card-body"><div class="card-name">${highlight(t.nom,query)}${tag}</div><div class="card-sub">${escapeHTML(t.type)}${t.adresse?' · '+escapeHTML(t.adresse):''}${dist?' · '+escapeHTML(dist):''}</div>${timeLine}</div>`;

  try {
    const data=await fetchTerrasses();
    document.getElementById('loadingState').style.display='none';
    document.getElementById('terrasseList').style.display='block';
    terrasses=data;
    terrasses.forEach(t=>{sunStates[t.id]=true;});
    document.getElementById('footerText').textContent=`${terrasses.length} terrasses · ${currentCity.nom}`;
    renderList(currentHeure,'');
    const launch=()=>{
      syncDots();
      if (viewer.scene.globe.tilesLoaded) { runShadow(); } else { scheduleShadow(); }
    };
    if(splashDone) launch();
    else{const w=setInterval(()=>{if(splashDone){clearInterval(w);launch();}},100);}
  }catch(e){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('terrasseList').style.display='block';
    document.getElementById('terrasseList').innerHTML=`<div class="no-results">Impossible de charger les terrasses.<br><button onclick="loadTerrasses()" style="margin-top:8px;background:#FFD600;border:none;padding:10px 20px;border-radius:12px;font-weight:600;cursor:pointer;font-size:14px;">🔄 Réessayer</button></div>`;
  }
}

async function init(){
  const now=new Date();
  const initH=Math.min(21,Math.max(6,now.getHours()+(Math.round(now.getMinutes()/15)*15/60)));
  slider.value=initH;
  slider.dispatchEvent(new Event('input'));

  // Géoloc auto au démarrage : zoom précis sur la position + rond bleu
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      const {longitude:lng,latitude:lat,accuracy}=pos.coords;
      placeUserDot(lng,lat,accuracy);
      const nearest=CITIES.reduce((best,city)=>{
        const d=Math.hypot(city.lat-lat,city.lng-lng);
        return d<Math.hypot(best.lat-lat,best.lng-lng)?city:best;
      });
      currentCity=nearest;
      focusUser(lng,lat,false);
      loadTerrasses();
      // Affinage : une 2e mesure GPS plus précise arrive souvent après 1-2s
      let refined=false;
      const wid=navigator.geolocation.watchPosition(p=>{
        const {longitude:l2,latitude:la2,accuracy:a2}=p.coords;
        placeUserDot(l2,la2,a2);
        if(!refined){ refined=true; focusUser(l2,la2,true); } // recadre une fois sur la position affinée
      },()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
      setTimeout(()=>navigator.geolocation.clearWatch(wid), 20000);
    },()=>{
      loadTerrasses();
    },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }else{
    loadTerrasses();
  }
}

init();
</script>
